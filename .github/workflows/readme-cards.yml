name: Update README cards

# The public github-readme-stats.vercel.app instance is paused (returns 503),
# so the stats / language / pinned-repo cards are generated here and committed
# into the repo. The README then loads them from ./profile/*.svg, which never breaks.

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=s-banerjee94&show_icons=true&include_all_commits=true&theme=radical&hide_border=true&rank_icon=github&card_width=420
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=s-banerjee94&layout=compact&langs_count=8&theme=radical&hide_border=true&card_width=320
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - marathon-bib-expo-service
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=s-banerjee94&repo=marathon-bib-expo-service&theme=radical&hide_border=true
          path: profile/pin-marathon-bib-expo-service.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - marathon-bib-expo-frontend
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=s-banerjee94&repo=marathon-bib-expo-frontend&theme=radical&hide_border=true
          path: profile/pin-marathon-bib-expo-frontend.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - interviewgenius
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=s-banerjee94&repo=interviewgenius&theme=radical&hide_border=true
          path: profile/pin-interviewgenius.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - leetcodesolutions
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=s-banerjee94&repo=leetcodesolutions&theme=radical&hide_border=true
          path: profile/pin-leetcodesolutions.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh README cards" || exit 0
          git pull --rebase origin main
          git push
